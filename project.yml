name: AskAndFind
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
targets:
  AskAndFind:
    type: application
    platform: iOS
    sources:
      - path: SpeechTherapy
        excludes:
          - Core/Persistence/LearningEvents.swift
          - Core/Persistence/ParentMetrics.swift
          - Features/HiddenObjects/Gameplay/GameplayEngine.swift
    info:
      path: SpeechTherapy/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.askandfind
        PRODUCT_NAME: Ask & Find
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - AskAndFindTests
  AskAndFindTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpeechTherapyTests
    dependencies:
      - target: AskAndFind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.askandfind.tests
